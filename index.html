<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExpoStudio</title>
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#0d0d12">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d12; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0d0d12; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0d12; color: #a9a7ba;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; transition: opacity .4s; z-index: 2; }
  #load.gone { opacity: 0; pointer-events: none; }
  .box { text-align: center; }
  .box img { width: 84px; height: 84px; }
  .box b { display: block; margin: 12px 0 6px; color: #ecebf3; font-size: 22px; }
  .box a { color: #a39bd9; font-size: 13px; display: none; margin-top: 14px; }
  .box.slow a { display: inline-block; }
</style>
</head>
<body>
  <!-- L'application ExpoStudio tourne sur le serveur maison : elle s'affiche ici en plein écran -->
  <iframe id="app" src="https://laptop.taild54d50.ts.net/expo/" title="ExpoStudio"
    allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
  <div id="load"><div class="box" id="box"><img src="logo.png" alt=""><b>ExpoStudio</b>Chargement…<br><a href="https://laptop.taild54d50.ts.net/expo/">Ça ne charge pas ? Ouvrir directement</a></div></div>
  <script>
    var app = document.getElementById('app');
    app.addEventListener('load', function () { document.getElementById('load').classList.add('gone'); app.focus(); });
    setTimeout(function () { document.getElementById('box').classList.add('slow'); }, 8000);
  </script>
</body>
</html>
